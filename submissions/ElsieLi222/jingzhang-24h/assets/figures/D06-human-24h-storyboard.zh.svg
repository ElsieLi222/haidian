#d06-storyboard{display:block;width:100%;height:auto;overflow:visible;}.d06-board text{font-family:inherit;fill:var(--foreground);}
#d06-storyboard .spine-shadow{fill:none;stroke:var(--border);stroke-width:14;}.d06-board .spine{fill:none;stroke:var(--foreground);stroke-width:1.3;}.d06-board .spine-marker{fill:none;stroke:var(--viz-series-1);stroke-width:2.3;stroke-dasharray:5 6;}.d06-board .spine-label{font-size:10px;fill:var(--muted-foreground);letter-spacing:.08em;}
