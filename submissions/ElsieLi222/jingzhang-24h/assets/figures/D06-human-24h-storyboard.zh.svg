<svg class="d06-board" viewBox="0 -100 1200 870" role="img" aria-labelledby="d06-title d06-desc">
    <title id="d06-title">林岚在京张的一天</title>
    <desc id="d06-desc">从早晨家庭出门、知识碰面、城市测试、穿过京张、公共空间停留，到大钟寺的工作与生活持续融合。六个连续片段以一条京张标识线串联，最后在午夜接入城市学习系统。</desc>
