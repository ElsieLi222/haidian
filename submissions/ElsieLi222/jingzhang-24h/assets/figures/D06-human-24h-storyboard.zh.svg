#d06-storyboard .building,.d06-board .office,.d06-board .campus,.d06-board .integrate-building,.d06-board .city-block{fill:color-mix(in srgb,var(--foreground) 12%,transparent);stroke:var(--foreground);stroke-width:1.1;}.d06-board .window{stroke:var(--muted-foreground);stroke-width:1;}.d06-board .walk,.d06-board .crossing,.d06-board .main-path{fill:none;stroke:var(--foreground);stroke-width:2;}.d06-board .crossing-line,.d06-board .shared-dash{stroke:var(--muted-foreground);stroke-width:1;}.d06-board .shared-lane,.d06-board .bike-path{fill:none;stroke:var(--viz-series-1);stroke-width:4;opacity:.7;}.d06-board .green-edge{fill:color-mix(in srgb,var(--viz-series-3) 21%,transparent);}.d06-board .cross-path{stroke:var(--foreground);stroke-width:1.2;stroke-dasharray:4 3;}.d06-board .commons-ground{fill:color-mix(in srgb,var(--viz-series-3) 16%,transparent);}.d06-board .tree{fill:color-mix(in srgb,var(--viz-series-3) 45%,transparent);stroke:var(--viz-series-3);stroke-width:1;}.d06-board .trunk{stroke:var(--foreground);stroke-width:1.6;}.d06-board .marker,.d06-board .marker-cap{stroke:var(--viz-series-1);stroke-width:2;}.d06-board .lan{fill:var(--viz-series-1);}.d06-board .lan-body{fill:color-mix(in srgb,var(--viz-series-1) 38%,transparent);stroke:var(--viz-series-1);stroke-width:1;}.d06-board .lan-bag{stroke:var(--viz-series-1);stroke-width:3;}.d06-board .child{fill:var(--viz-series-2);}.d06-board .child-body,.d06-board .partner-body,.d06-board .friend-body{fill:color-mix(in srgb,var(--foreground) 18%,transparent);stroke:var(--foreground);stroke-width:1;}.d06-board .child-step{stroke:var(--foreground);stroke-width:1.3;}.d06-board .elder,.d06-board .partner,.d06-board .friend,.d06-board .visitor,.d06-board .small-person{fill:var(--foreground);}.d06-board .elder-body,.d06-board .small-body{fill:color-mix(in srgb,var(--foreground) 16%,transparent);}.d06-board .meeting{fill:none;stroke:var(--viz-series-1);stroke-width:1.5;}.d06-board .robot{fill:var(--background);stroke:var(--fo