<svg class="d07-diagram" viewBox="0 -100 1000 980" role="img" aria-labelledby="d07-title d07-desc">
    <title id="d07-title">LEARNING Urban Learning System</title>
    <desc id="d07-desc">The diagram moves from DAY N operations through midnight review, four decisions and fast/slow learning loops into an adjusted DAY N+1. The bottom shows compact evidence from accessibility, Wudaokou and Dazhongsi plus the annual Open Day stress test.</desc>
    <defs><style><![CDATA[
#d07-learning-system{width:100%;color:var(--foreground);font-family:inherit;}
#d07-learning-system .d07-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:10px;}
#d07-learning-system h1{margin:1px 0 0;font-weight:500;}
#d07-learning-system .d07-kicker{color:var(--viz-series-3);font-weight:500;letter-spacing:.08em;}
#d07-learning-system .d07-sub{max-width:380px;color:var(--muted-foreground);text-align:right;}
#d07-learning-system{display:block;width:100%;height:auto;overflow:visible;}
#d07-learning-system text{font-family:inherit;fill:var(--foreground);}
#d07-learning-system .section{font-size:12px;font-weight:500;letter-spacing:.08em;fill:var(--muted-foreground)!important;}
#d07-learning-system .rule{stroke:var(--border);stroke-width:1;}
#d07-learning-system .field{fill:color-mix(in srgb,var(--muted) 34%,transparent);stroke:var(--border);stroke-width:1.2;}
#d07-learning-system .micro{font-size:11px;font-weight:500;letter-spacing:.09em;fill:var(--muted-foreground)!important;}
#d07-learning-system .node-title{font-size:17px;font-weight:500;}
#d07-learning-system .node-sub{font-size:12px;fill:var(--muted-foreground)!important;}
#d07-learning-system .tiny{font-size:10px;fill:var(--muted-foreground)!important;}
#d07-learning-system .center{text-anchor:middle;}
#d07-learning-system .street{stroke:var(--foreground);stroke-width:2;opacity:.65;}
#d07-learning-system .street-light{stroke:var(--border);stroke-width:1.2;}
#d07-learning-system .person{fill:var(--foreground);}
#d07-learning-system .flow-line{fill:none;stroke:var(--viz-series-3);stroke-width:3;stroke-linecap:round;}
#d07-learning-system .connector,.d07-wrap .case-arrow,.d07-wrap .small-arrow{fill:none;stroke:var(--foreground);stroke-width:1.3;}
#d07-learning-system .signal{font-size:9px;font-weight:500;letter-spacing:.08em;fill:var(--muted-foreground)!important;}
#d07-learning-system .review-cat{font-size:10px;font-weight:500;letter-spacing:.06em;fill:var(--viz-series-1)!important;}
#d07-learning-system .review-ring{fill:color-mix(in srgb,var(--viz-series-1) 12%,transparent);stroke:var(--viz-series-1);stroke-width:1.5;}
#d07-learning-system .review-core{fill:var(--background);stroke:var(--foreground);stroke-width:1;}
#d07-learning-system .decision{fill:color-mix(in srgb,var(--muted) 42%,transparent);stroke:var(--border);stroke-width:1;}
#d07-learning-system .d1{stroke:var(--viz-series-3);}.d07-wrap .d2{stroke:var(--viz-series-4);}.d07-wrap .d3{stroke:var(--viz-series-2);}.d07-wrap .d4{stroke:var(--viz-series-5);}
#d07-learning-system .decision-title{font-size:13px;font-weight:500;}
#d07-learning-system .spiral-path{fill:none;stroke:var(--viz-series-1);stroke-width:3;}
#d07-learning-system .loop-head{font-size:15px;font-weight:500;fill:var(--viz-series-1)!important;}.d07-wrap .slowhead{fill:var(--viz-series-5)!important;}
#d07-learning-system .loop-track{fill:none;stroke-width:1.7;}.d07-wrap .fast{stroke:var(--viz-series-1);}.d07-wrap .slow{stroke:var(--viz-series-5);}
#d07-learning-system .loop-dot{fill:var(--background);stroke:var(--viz-series-1);stroke-width:1.5;}.d07-wrap .slowdot{stroke:var(--viz-series-5);}
#d07-learning-system .dot-text{font-size:12px;text-anchor:middle;font-weight:500;}
#d07-learning-system .down{fill:none;stroke:var(--viz-series-5);stroke-width:1.5;stroke-dasharray:4 4;}
#d07-learning-system .loop-note{font-size:12px;fill:var(--muted-foreground)!important;}
#d07-learning-system .case-id{font-size:10px;font-weight:500;letter-spacing:.08em;fill:var(--muted-foreground)!important;}
#d07-learning-system .case-title{font-size:15px;font-weight:500;}
#d07-learning-system .case-line{stroke:var(--border);stroke-width:1.2;}
#d07-learning-system .case-node{fill:var(--background);stroke:var(--foreground);stroke-width:1.2;}.d07-wrap .case-dot{font-size:11px;text-anchor:middle;font-weight:500;}
#d07-learning-system .annual-line{fill:none;stroke:var(--foreground);stroke-width:1.2;}.d07-wrap .annual-line.emphasis{stroke:var(--viz-series-3);stroke-width:2;}
#d07-learning-system .annual-label{font-size:11px;font-weight:500;letter-spacing:.06em;}
@media(max-width:620px){
 #d07-learning-system .d07-head{align-items:flex-start;flex-direction:column;gap:6px;}#d07-learning-system .d07-sub{text-align:left;}
 #d07-learning-system{min-width:780px;transform-origin:top left;}
}
#d07-learning-system .export-kicker{font-family:Arial,sans-serif;font-size:12px;font-weight:500;letter-spacing:.08em;fill:var(--viz-series-3)}
#d07-learning-system .export-title{font-family:Arial,sans-serif;font-size:24px;font-weight:500;fill:var(--foreground)}
#d07-learning-system .export-lead{font-family:Arial,sans-serif;font-size:13px;fill:var(--muted-foreground);text-anchor:end}]]></style><text x="0" y="-72" class="export-kicker">D07｜JINGZHANG 24H</text><text x="0" y="-42" class="export-title">LEARNING | Urban Learning System</text><text x="100%" y="-58" class="export-lead">Review moves daily operations into a better next state.</text>
      <marker id="d07-arrow" viewBox="0 -100 1000 980" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--foreground)"/></marker>
      <marker id="d07-arrow-green" viewBox="0 -100 1000 980" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--viz-series-3)"/></marker>
      <marker id="d07-arrow-purple" viewBox="0 -100 1000 980" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--viz-series-5)"/></marker>
    </defs>

    <!-- Main line -->
    <g class="main">
      <text x="42" y="52" class="section">DAILY LEARNING SPIRAL</text>
      <path class="rule" d="M42 65H958"/>

      <g transform="translate(48,106)">
        <rect class="field" width="230" height="170"/>
        <text x="18" y="30" class="micro">DAY N</text>
        <text x="18" y="61" class="node-title">Real city operations</text>
        <text x="18" y="84" class="node-sub">FLOW / TEST / COMMONS / INTEGRATE</text>
        <path class="street" d="M24 122H198"/>
        <path class="street-light" d="M88 109V144M146 109V144"/>
        <circle class="person" cx="55" cy="122" r="4"/><circle class="person" cx="106" cy="122" r="4"/><circle class="person" cx="165" cy="122" r="4"/>
        <path class="flow-line" d="M35 135C68 150 107 101 148 133S183 145 201 118"/>
        <text x="18" y="158" class="tiny">Daily use, testing and sharing continuously leave feedback</text>
      </g>
      <path class="connector" d="M280 191H328" marker-end="url(#d07-arrow)"/>
      <text x="286" y="216" class="signal">SENSE</text><path class="small-arrow" d="M323 212H337" marker-end="url(#d07-arrow)"/>
      <text x="342" y="216" class="signal">RESPOND</text><path class="small-arrow" d="M404 212H418" marker-end="url(#d07-arrow)"/>
      <text x="423" y="216" class="signal">TEST</text><path class="small-arrow" d="M457 212H471" marker-end="url(#d07-arrow)"/>
      <text x="476" y="216" class="signal">FEEDBACK</text>

      <g transform="translate(344,98)">
        <circle class="review-ring" cx="92" cy="92" r="78"/>
        <circle class="review-core" cx="92" cy="92" r="51"/>
        <text x="92" y="78" class="micro center">00:00</text>
        <text x="92" y="100" class="node-title center">DAILY</text>
        <text x="92" y="120" class="node-title center">REVIEW</text>
        <text x="92" y="188" class="tiny center">Operating results × user experience × place performance</text>
      </g>
      <g class="review-content" transform="translate(318,280)">
        <text x="0" y="0" class="micro">Five review inputs</text>
        <g transform="translate(0,17)"><text x="0" y="0" class="review-cat">FLOW</text><text x="0" y="15" class="tiny">movement / entry / detour</text><text x="0" y="28" class="tiny">transfer / speed difference</text></g>
        <g transform="translate(106,17)"><text x="0" y="0" class="review-cat">TEST</text><text x="0" y="15" class="tiny">product performance / environmental adaptation</text><text x="0" y="28" class="tiny">recurrent anomalies</text></g>
        <g transform="translate(235,17)"><text x="0" y="0" class="review-cat">COMMONS</text><text x="0" y="15" class="tiny">SPACE × TIME</text><text x="0" y="28" class="tiny">× PEOPLE</text></g>
        <g transform="translate(348,17)"><text x="0" y="0" class="review-cat">INTEGRATE</text><text x="0" y="15" class="tiny">industry / transport / commerce</text><text x="0" y="28" class="tiny">community continuity</text></g>
        <g transform="translate(493,17)"><text x="0" y="0" class="review-cat">HUMAN FEEDBACK</text><text x="0" y="15" class="tiny">public / operations / community</text><text x="0" y="28" class="tiny">enterprise / university</text></g>
      </g>
      <path class="connector" d="M530 191H568" marker-end="url(#d07-arrow)"/>
      <text x="537" y="216" class="signal">LEARN</text><path class="small-arrow" d="M577 212H591" marker-end="url(#d07-arrow)"/><text x="597" y="216" class="signal">ADAPT</text>

      <g transform="translate(584,84)">
        <text x="0" y="15" class="micro">Four decisions</text>
        <g transform="translate(0,31)"><rect class="decision d1" width="152" height="50"/><text x="13" y="21" class="micro">01</text><text x="43" y="22" class="decision-title">Adjust now</text><text x="43" y="39" class="tiny">ADJUST NOW</text></g>
        <g transform="translate(166,31)"><rect class="decision d2" width="152" height="50"/><text x="13" y="21" class="micro">02</text><text x="43" y="22" class="decision-title">Keep watching</text><text x="43" y="39" class="tiny">KEEP WATCHING</text></g>
        <g transform="translate(0,95)"><rect class="decision d3" width="152" height="50"/><text x="13" y="21" class="micro">03</text><text x="43" y="22" class="decision-title">Test again</text><text x="43" y="39" class="tiny">TEST AGAIN</text></g>
        <g transform="translate(166,95)"><rect class="decision d4" width="152" height="50"/><text x="13" y="21" class="micro">04</text><text x="43" y="22" class="decision-title">Escalate</text><text x="43" y="39" class="tiny">ESCALATE</text></g>
      </g>
    </g>

    <!-- simplified learning spiral -->
    <g class="spiral">
      <path d="M655 288C688 262 731 262 760 288S829 314 858 288S923 262 944 290" class="spiral-path" marker-end="url(#d07-arrow-green)"/>
      <text x="654" y="257" class="micro">DAY N</text><text x="712" y="245" class="micro">REVIEW</text><text x="771" y="257" class="micro">DAY N+1′</text><text x="838" y="245" class="micro">REVIEW</text><text x="899" y="257" class="micro">DAY N+2″</text>
      <text x="798" y="333" class="node-title center">Daily feedback changes the next operating state</text>
    </g>

    <!-- fast slow loop -->
    <g class="loops" transform="translate(42,388)">
      <text x="0" y="0" class="section">Test first, then change｜FAST / SLOW</text>
      <path class="rule" d="M0 12H916"/>
      <g transform="translate(0,42)">
        <text x="0" y="18" class="loop-head">FAST LOOP</text><text x="0" y="40" class="node-sub">minutes — hours — next day</text>
        <path class="loop-track fast" d="M170 28H500" marker-end="url(#d07-arrow-green)"/>
        <g transform="translate(188,0)"><circle class="loop-dot" cx="0" cy="28" r="16"/><text x="0" y="61" class="tiny center">Operational adjustment</text></g>
        <g transform="translate(285,0)"><circle class="loop-dot" cx="0" cy="28" r="16"/><text x="0" y="61" class="tiny center">Wayfinding optimisation</text></g>
        <g transform="translate(382,0)"><circle class="loop-dot" cx="0" cy="28" r="16"/><text x="0" y="61" class="tiny center">Facility deployment</text></g>
        <g transform="translate(479,0)"><circle class="loop-dot" cx="0" cy="28" r="16"/><text x="0" y="61" class="tiny center">Time-slot adjustment</text></g>
      </g>
      <path class="down" d="M457 115V148" marker-end="url(#d07-arrow-purple)"/>
      <text x="476" y="126" class="loop-head slowhead">Test first, then change</text><text x="476" y="141" class="tiny">Only persistent issues enter long-term spatial adjustment</text>
      <g transform="translate(0,170)">
        <text x="0" y="18" class="loop-head slowhead">SLOW LOOP</text><text x="0" y="40" class="node-sub">weeks — months — years</text>
        <path class="loop-track slow" d="M170 28H455" marker-end="url(#d07-arrow-purple)"/>
        <g transform="translate(185,0)"><circle class="loop-dot slowdot" cx="0" cy="28" r="16"/><text x="0" y="61" class="tiny center">Facility optimisation</text></g>
        <g transform="translate(315,0)"><circle class="loop-dot slowdot" cx="0" cy="28" r="16"/><text x="0" y="61" class="tiny center">Micro-update</text></g>
        <g transform="translate(445,0)"><circle class="loop-dot slowdot" cx="0" cy="28" r="16"/><text x="0" y="61" class="tiny center">Strategic adjustment</text></g>
      </g>
    </g>

    <!-- case evidence -->
    <g class="cases" transform="translate(42,674)">
      <text x="0" y="0" class="section">DAILY LEARNING EVIDENCE</text>
      <path class="rule" d="M0 12H916"/>
      <g transform="translate(0,38)">
        <text x="0" y="0" class="case-id">CASE 01｜N1</text><text x="0" y="20" class="case-title">Accessibility</text>
        <path class="case-line" d="M0 45H230"/>
        <circle class="case-node" cx="20" cy="45" r="12"/><text x="20" y="49" class="case-dot">D</text><text x="43" y="50" class="tiny">AI navigation detour</text>
        <path class="case-arrow" d="M122 45H148" marker-end="url(#d07-arrow)"/>
        <circle class="case-node" cx="170" cy="45" r="12"/><text x="170" y="49" class="case-dot">B</text><text x="193" y="50" class="tiny">Persistent barrier</text>
        <path class="case-arrow" d="M70 78H190" marker-end="url(#d07-arrow-green)"/><text x="80" y="98" class="tiny">Spatial repair</text>
      </g>
      <g transform="translate(326,38)">
        <text x="0" y="0" class="case-id">CASE 02｜N3</text><text x="0" y="20" class="case-title">Wudaokou</text>
        <path class="case-line" d="M0 45H230"/>
        <circle class="case-node" cx="20" cy="45" r="12"/><text x="20" y="49" class="case-dot">M</text><text x="43" y="50" class="tiny">Multimodal interface</text>
        <path class="case-arrow" d="M126 45H148" marker-end="url(#d07-arrow)"/>
        <circle class="case-node" cx="170" cy="45" r="12"/><text x="170" y="49" class="case-dot">O</text><text x="193" y="50" class="tiny">Ongoing observation</text>
        <path class="case-arrow" d="M70 78H190" marker-end="url(#d07-arrow-green)"/><text x="83" y="98" class="tiny">Operate → micro-update when needed</text>
      </g>
      <g transform="translate(652,38)">
        <text x="0" y="0" class="case-id">CASE 03｜N7</text><text x="0" y="20" class="case-title">Dazhongsi</text>
        <path class="case-line" d="M0 45H230"/>
        <circle class="case-node" cx="20" cy="45" r="12"/><text x="20" y="49" class="case-dot">D</text><text x="43" y="50" class="tiny">DAY / EVENING / NIGHT</text>
        <path class="case-arrow" d="M165 45H184" marker-end="url(#d07-arrow)"/>
        <circle class="case-node" cx="205" cy="45" r="12"/><text x="205" y="49" class="case-dot">T</text>
        <path class="case-arrow" d="M62 78H190" marker-end="url(#d07-arrow-green)"/><text x="74" y="98" class="tiny">Time-based operation → long-term adjustment</text>
      </g>
    </g>

    <!-- annual -->
    <g class="annual" transform="translate(42,850)">
      <text x="0" y="-36" class="section">YEAR LOOP</text>
      <path class="annual-line" d="M0 0H135" marker-end="url(#d07-arrow)"/><text x="0" y="-12" class="annual-label">NORMAL</text>
      <path class="annual-line emphasis" d="M172 0H377" marker-end="url(#d07-arrow-green)"/><text x="172" y="-12" class="annual-label">JINGZHANG 24H OPEN DAY</text>
      <path class="annual-line" d="M414 0H525" marker-end="url(#d07-arrow)"/><text x="414" y="-12" class="annual-label">REVIEW</text>
      <path class="annual-line" d="M562 0H670" marker-end="url(#d07-arrow-purple)"/><text x="562" y="-12" class="annual-label">NEXT</text>
      <text x="715" y="-12" class="tiny">Annual stress test: ACCESS · SAFETY · VITALITY · INCLUSION</text>
    </g>
  </svg>
